# =============================================================================
# optimized-deployments.yaml  —  RIGHT-SIZED resource configuration
# =============================================================================
# HOW TO USE THIS FILE:
#
# DO NOT apply this file before you have collected baseline measurements.
# The correct workflow is:
#
#   1.  Deploy baseline workloads (k8s/api|worker|report-deployment.yaml)
#   2.  Run: bash load-testing/load-test.sh medium
#   3.  Run: bash scripts/collect-baseline.sh
#   4.  Run: kubectl top pods -n cost-demo   (note the actual CPU/memory figures)
#   5.  EDIT the resource requests below based on your observed utilisation:
#       - A safe rule of thumb: set request = (peak observed usage) * 1.3
#       - Set limit = request * 2
#   6.  Apply this file: kubectl apply -f k8s/optimized-deployments.yaml
#   7.  Run: bash load-testing/load-test.sh medium
#   8.  Run: bash scripts/collect-after.sh
#
# The PLACEHOLDER values below are intentionally conservative starting points.
# Replace them with numbers derived from your actual kubectl top output.
# =============================================================================

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-service
  namespace: cost-demo
  labels:
    app: api-service
    project: k8s-cost-optimization
    phase: optimized
  annotations:
    optimization-note: "Right-sized after baseline measurement — see results/baseline.csv"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-service
  template:
    metadata:
      labels:
        app: api-service
        project: k8s-cost-optimization
        phase: optimized
    spec:
      containers:
        - name: api-service
          image: nginx:1.25-alpine
          ports:
            - containerPort: 8080
          # ── FILL IN AFTER MEASUREMENT ──────────────────────────────────
          # Example: if kubectl top showed ~80m CPU and ~120Mi memory at peak,
          # a reasonable request might be 110m CPU and 160Mi memory.
          # Replace the placeholder values below with your measured numbers.
          resources:
            requests:
              cpu: "5m"      # measured: 1m × 1.3 ≈ 2m; using 5m as safe minimum
              memory: "20Mi" # measured: 12Mi × 1.3 ≈ 16Mi; using 20Mi
            limits:
              cpu: "10m"
              memory: "40Mi"
          # ────────────────────────────────────────────────────────────────
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: background-worker
  namespace: cost-demo
  labels:
    app: background-worker
    project: k8s-cost-optimization
    phase: optimized
  annotations:
    optimization-note: "Right-sized after baseline measurement — see results/baseline.csv"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: background-worker
  template:
    metadata:
      labels:
        app: background-worker
        project: k8s-cost-optimization
        phase: optimized
    spec:
      containers:
        - name: background-worker
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              echo "Optimized background worker started"
              while true; do
                # Same workload as baseline — so measurements are comparable
                for i in $(seq 1 100); do echo "$i" > /dev/null; done
                sleep 5
              done
          # ── FILL IN AFTER MEASUREMENT ──────────────────────────────────
          # NOTE: The worker's actual usage depends on whether it receives
          # tasks via the job queue (api-service → worker). Measure under
          # realistic load before setting these values.
          resources:
            requests:
              cpu: "110m"   # measured: 82m × 1.3 ≈ 107m; rounded to 110m
              memory: "32Mi" # measured: ~0Mi shown; using 32Mi safe minimum
            limits:
              cpu: "220m"
              memory: "64Mi"
          # ────────────────────────────────────────────────────────────────

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-service
  namespace: cost-demo
  labels:
    app: report-service
    project: k8s-cost-optimization
    phase: optimized
  annotations:
    optimization-note: "PRIMARY OPTIMIZATION TARGET — see results/baseline.csv"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: report-service
  template:
    metadata:
      labels:
        app: report-service
        project: k8s-cost-optimization
        phase: optimized
    spec:
      containers:
        - name: report-service
          image: nginx:1.25-alpine
          ports:
            - containerPort: 8080
          # ── FILL IN AFTER MEASUREMENT ──────────────────────────────────
          # This is the main optimization target.
          # Baseline requests: 2000m CPU / 2Gi memory.
          # Expected actual usage: much lower (this is the point of the demo).
          # Set your optimized request based on measured peak utilisation * 1.3.
          resources:
            requests:
              cpu: "5m"      # measured: 1m × 1.3 ≈ 2m; using 5m safe minimum
              memory: "20Mi" # measured: 12Mi × 1.3 ≈ 16Mi; using 20Mi
            limits:
              cpu: "10m"
              memory: "40Mi"
          # ────────────────────────────────────────────────────────────────
          volumeMounts:
            - name: report-nginx-config
              mountPath: /etc/nginx/conf.d
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: report-nginx-config
          configMap:
            name: report-nginx-config
