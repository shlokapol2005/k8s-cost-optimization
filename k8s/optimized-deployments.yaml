# =============================================================================
# optimized-deployments.yaml  —  RIGHT-SIZED resource configuration
# =============================================================================
# Values derived from baseline measurements (results/baseline.csv)
# Methodology: request = ceil(peak_observed_usage × 1.3)
#
# Baseline kubectl top readings (2026-09-21T08:47:42Z under medium load):
#   api-service:       CPU=1m,  Memory=12Mi
#   background-worker: CPU=82m, Memory=~0Mi
#   report-service:    CPU=1m,  Memory=12Mi
#
# Before → After summary:
#   Total CPU requests:    3500m → 120m  (↓ 96.6%)
#   Total Memory requests: ~3.5Gi → 72Mi (↓ 98%)
#   Estimated cost:        $0.1195/hr → $0.0006/hr (↓ 99.5%)
#
# Apply with: kubectl apply -f k8s/optimized-deployments.yaml
# Verify with: kubectl rollout status deployment -n cost-demo
# =============================================================================

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-service
  namespace: cost-demo
  labels:
    app: api-service
    project: k8s-cost-optimization
    phase: optimized
  annotations:
    optimization-note: "Right-sized after baseline measurement — see results/baseline.csv"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-service
  template:
    metadata:
      labels:
        app: api-service
        project: k8s-cost-optimization
        phase: optimized
    spec:
      containers:
        - name: api-service
          image: nginx:1.25-alpine
          ports:
            - containerPort: 8080
          # ── OPTIMIZED (right-sized from baseline measurement) ────────────
          # Baseline observed: CPU=1m, Memory=12Mi  (kubectl top, medium load)
          # Formula: request = observed × 1.3 → CPU: 1×1.3=1.3m → 5m (safe min)
          #                                    → Mem: 12×1.3=15.6Mi → 20Mi
          resources:
            requests:
              cpu: "5m"      # measured: 1m × 1.3 ≈ 2m; using 5m as safe minimum
              memory: "20Mi" # measured: 12Mi × 1.3 ≈ 16Mi; using 20Mi
            limits:
              cpu: "10m"     # limit = request × 2
              memory: "40Mi" # limit = request × 2
          # ────────────────────────────────────────────────────────────────
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: background-worker
  namespace: cost-demo
  labels:
    app: background-worker
    project: k8s-cost-optimization
    phase: optimized
  annotations:
    optimization-note: "Right-sized after baseline measurement — see results/baseline.csv"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: background-worker
  template:
    metadata:
      labels:
        app: background-worker
        project: k8s-cost-optimization
        phase: optimized
    spec:
      containers:
        - name: background-worker
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              echo "Optimized background worker started"
              while true; do
                # Same workload as baseline — so measurements are comparable
                for i in $(seq 1 100); do echo "$i" > /dev/null; done
                sleep 5
              done
          # ── OPTIMIZED (right-sized from baseline measurement) ────────────
          # Baseline observed: CPU=82m, Memory=~0Mi (kubectl top, medium load)
          # Formula: request = observed × 1.3 → CPU: 82×1.3=106.6m → 110m
          #                                    → Mem: 0Mi → using 32Mi safe min
          resources:
            requests:
              cpu: "110m"    # measured: 82m × 1.3 ≈ 107m; rounded to 110m
              memory: "32Mi" # measured: ~0Mi shown; using 32Mi safe minimum
            limits:
              cpu: "220m"    # limit = request × 2
              memory: "64Mi" # limit = request × 2
          # ────────────────────────────────────────────────────────────────

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-service
  namespace: cost-demo
  labels:
    app: report-service
    project: k8s-cost-optimization
    phase: optimized
  annotations:
    optimization-note: "PRIMARY OPTIMIZATION TARGET — see results/baseline.csv"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: report-service
  template:
    metadata:
      labels:
        app: report-service
        project: k8s-cost-optimization
        phase: optimized
    spec:
      containers:
        - name: report-service
          image: nginx:1.25-alpine
          ports:
            - containerPort: 8080
          # ── OPTIMIZED (PRIMARY TARGET — right-sized from baseline) ────────
          # Baseline requests: 2000m CPU / 2Gi memory (intentionally excessive).
          # Baseline observed:  CPU=1m,  Memory=12Mi  (kubectl top, medium load)
          # Formula: request = observed × 1.3 → CPU: 1×1.3=1.3m → 5m (safe min)
          #                                    → Mem: 12×1.3=15.6Mi → 20Mi
          # Result: 99.8% CPU reduction, 99% memory reduction for this workload.
          resources:
            requests:
              cpu: "5m"      # measured: 1m × 1.3 ≈ 2m; using 5m safe minimum
              memory: "20Mi" # measured: 12Mi × 1.3 ≈ 16Mi; using 20Mi
            limits:
              cpu: "10m"     # limit = request × 2
              memory: "40Mi" # limit = request × 2
          # ────────────────────────────────────────────────────────────────
          volumeMounts:
            - name: report-nginx-config
              mountPath: /etc/nginx/conf.d
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: report-nginx-config
          configMap:
            name: report-nginx-config
