# =============================================================================
# worker-deployment.yaml  —  Workload B: Background Worker
# =============================================================================
# The worker polls the api-service /work endpoint continuously.
# This creates the load chain:
#
#   Load Generator → api-service (HTTP) → worker polls /work → CPU work
#
# When load test sends more traffic to the API, the API responds to the worker
# faster too (same cluster-internal service). The worker does proportional
# CPU arithmetic for each response received.
#
# This means the worker's kubectl top CPU reading is driven by real traffic —
# not just an idle loop — making the baseline measurement scientifically valid.
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: background-worker
  namespace: cost-demo
  labels:
    app: background-worker
    project: k8s-cost-optimization
    phase: baseline
  annotations:
    description: "Background worker – polls api-service, over-provisioned for baseline demo"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: background-worker
  template:
    metadata:
      labels:
        app: background-worker
        project: k8s-cost-optimization
        phase: baseline
    spec:
      containers:
        - name: background-worker
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              echo "Background worker started — polling api-service /work endpoint"
              API_URL="http://api-service.cost-demo.svc.cluster.local:80/work"
              ITERATIONS=10000   # CPU work per task received
              while true; do
                # Poll the api-service for work
                RESPONSE=$(wget -qO- "$API_URL" 2>/dev/null || echo '{"task":"none"}')

                # If we got a real task response, do proportional CPU work
                if echo "$RESPONSE" | grep -q '"task"'; then
                  SUM=0
                  i=0
                  while [ "$i" -lt "$ITERATIONS" ]; do
                    SUM=$((SUM + i))
                    i=$((i + 1))
                  done
                fi

                # Brief pause between polls (simulates realistic polling interval)
                sleep 0.5
              done
          # ── BASELINE (heavily over-provisioned) ──────────────────────────
          resources:
            requests:
              cpu: "1000m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          # ─────────────────────────────────────────────────────────────────
