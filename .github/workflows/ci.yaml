name: k8s-cost-optimization
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # JOB 1: Validate all Kubernetes YAML manifests
  # ──────────────────────────────────────────────────────────────────────────
  validate-k8s-manifests:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "v1.28.0"

      - name: Validate k8s manifests (dry-run)
        run: |
          echo "=== Validating Kubernetes YAML manifests ==="
          for f in k8s/*.yaml; do
            echo "Checking: $f"
            kubectl apply --dry-run=client -f "$f" 2>&1 || true
          done
          echo "=== Validation complete ==="

      - name: Lint YAML with yamllint
        run: |
          pip install yamllint
          yamllint -d relaxed k8s/ monitoring/ opencost/ || true

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 2: Validate shell scripts
  # ──────────────────────────────────────────────────────────────────────────
  validate-scripts:
    name: Validate Shell Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Lint shell scripts
        run: |
          echo "=== Linting shell scripts ==="
          find scripts/ load-testing/ -name "*.sh" -exec shellcheck --severity=warning {} \; || true
          echo "=== Script linting complete ==="

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 3: Validate Grafana dashboard JSON
  # ──────────────────────────────────────────────────────────────────────────
  validate-grafana-dashboard:
    name: Validate Grafana Dashboard JSON
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate JSON syntax
        run: |
          echo "=== Checking Grafana dashboard JSON ==="
          python3 -c "
          import json, sys
          with open('monitoring/grafana/dashboard.json') as f:
            data = json.load(f)
          print('Dashboard title:', data.get('title'))
          print('Panel count:', len(data.get('panels', [])))
          print('JSON is valid.')
          "

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 4: Summary
  # ──────────────────────────────────────────────────────────────────────────
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [validate-k8s-manifests, validate-scripts, validate-grafana-dashboard]
    steps:
      - name: Print CI result
        run: |
          echo "============================================================"
          echo "  CI Pipeline Passed!"
          echo "  ✔ Kubernetes manifests validated"
          echo "  ✔ Shell scripts linted"
          echo "  ✔ Grafana dashboard JSON valid"
          echo ""
          echo "  NOTE: Actual deployment and cost experiments run locally"
          echo "  on Minikube — not in CI. See README.md for instructions."
          echo "============================================================"
