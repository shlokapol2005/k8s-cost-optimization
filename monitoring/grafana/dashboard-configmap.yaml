apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  k8s-cost-optimization.json: |
    # NOTE: The actual dashboard JSON is in monitoring/grafana/dashboard.json
    # You can import it manually via Grafana UI: Dashboards → Import → Upload JSON
    # Or apply the full ConfigMap generated by running:
    #   kubectl create configmap grafana-dashboards \
    #     --from-file=k8s-cost-optimization.json=monitoring/grafana/dashboard.json \
    #     -n monitoring --dry-run=client -o yaml | kubectl apply -f -
